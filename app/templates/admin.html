<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub Admin Panel &bull; Tile & User Access Management</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-hover: #1c2128;
      --border: #30363d;
      --border-hover: #58a6ff;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #bc8cff;
      --red: #f85149;
      --orange: #f0883e;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .back-btn {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
    h1 {
      color: var(--text-bright);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #238636;
      color: #fff;
    }
    .btn-primary:hover {
      background: #2ea043;
    }
    .btn-secondary {
      background: #21262d;
      color: var(--text-bright);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      background: #30363d;
    }
    .btn-danger {
      background: rgba(248, 81, 73, 0.15);
      color: var(--red);
      border-color: rgba(248, 81, 73, 0.3);
    }
    .btn-danger:hover {
      background: rgba(248, 81, 73, 0.3);
    }
    .btn-sm {
      padding: 0.3rem 0.65rem;
      font-size: 0.775rem;
    }
    .tiles-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .tiles-table th, .tiles-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .tiles-table th {
      background: #1c2128;
      color: var(--text-bright);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .tiles-table tr:last-child td {
      border-bottom: none;
    }
    .tiles-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }
    .tile-title-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 600;
      color: var(--text-bright);
    }
    .tile-icon {
      font-size: 1.25rem;
    }
    .tile-url {
      font-size: 0.775rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .user-pill-tag {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border-radius: 12px;
      font-size: 0.75rem;
      margin: 0.1rem;
    }
    .user-wildcard-tag {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-preview {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-purple { background: rgba(188, 140, 255, 0.15); color: var(--purple); }
    .badge-green { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-blue { background: rgba(88, 166, 255, 0.15); color: var(--accent); }
    .badge-orange { background: rgba(240, 136, 62, 0.15); color: var(--orange); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-bright);
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 0.35rem;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-bright);
      font-family: inherit;
      font-size: 0.875rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
    }
    .form-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="/" class="back-btn">&larr; Back to Hub</a>
        <h1>Hub Tile & Access Management</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openAddModal()">+ Add New Tile</button>
      </div>
    </header>

    <table class="tiles-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Service Tile</th>
          <th>Category</th>
          <th>Badge</th>
          <th>User Access Control (RBAC)</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tiles-tbody">
        <!-- Rendered via JS -->
      </tbody>
    </table>
  </div>

  <!-- Modal for Add/Edit -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Add New Tile</div>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
      </div>
      <form id="tile-form" onsubmit="saveTile(event)">
        <input type="hidden" id="tile-id">

        <div class="form-row">
          <div class="form-group">
            <label for="tile-title">Title *</label>
            <input type="text" id="tile-title" required placeholder="e.g. SheepVibes">
          </div>
          <div class="form-group">
            <label for="tile-icon">Icon (Emoji or text) *</label>
            <input type="text" id="tile-icon" required placeholder="e.g. 🐑">
          </div>
        </div>

        <div class="form-group">
          <label for="tile-url">Service URL *</label>
          <input type="text" id="tile-url" required placeholder="https://sheepvibes.pavese.fr/">
        </div>

        <div class="form-group">
          <label for="tile-description">Description</label>
          <textarea id="tile-description" rows="2" placeholder="Brief summary of service..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tile-category">Category</label>
            <input type="text" id="tile-category" value="Web Applications & Dashboards">
          </div>
          <div class="form-group">
            <label for="tile-sort">Sort Order</label>
            <input type="number" id="tile-sort" value="1">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tile-badge">Badge Text (Optional)</label>
            <input type="text" id="tile-badge" placeholder="e.g. 🔒 SSO">
          </div>
          <div class="form-group">
            <label for="tile-badge-color">Badge Color</label>
            <select id="tile-badge-color">
              <option value="purple">Purple (SSO)</option>
              <option value="green">Green (Public / Native)</option>
              <option value="blue">Blue</option>
              <option value="orange">Orange</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="tile-footer">Footer Action Text</label>
          <input type="text" id="tile-footer" value="Open →">
        </div>

        <div class="form-group">
          <label for="tile-allowed">Allowed Users (Visibility ACL) *</label>
          <input type="text" id="tile-allowed" required value="*">
          <div class="form-hint">Enter <strong>*</strong> for all authenticated users, or comma-separated emails (e.g. <code>sheepdestroyer@gmail.com, ulysse.pavese@gmail.com</code>).</div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="tile-enabled" checked>
          <label for="tile-enabled" style="margin: 0; cursor: pointer;">Tile Enabled / Active</label>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Save Tile</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentTiles = [];

    async function loadTiles() {
      try {
        const res = await fetch("/api/admin/tiles");
        if (!res.ok) {
          if (res.status === 403) {
            alert("Forbidden: You do not have admin permissions.");
            window.location.href = "/";
            return;
          }
          throw new Error("Failed to load tiles");
        }
        currentTiles = await res.json();
        renderTable();
      } catch (e) {
        console.error(e);
      }
    }

    function renderTable() {
      const tbody = document.getElementById("tiles-tbody");
      tbody.innerHTML = "";

      currentTiles.forEach(tile => {
        const tr = document.createElement("tr");

        let allowedHtml = "";
        if (tile.allowed_users.includes("*")) {
          allowedHtml = '<span class="user-wildcard-tag">🌐 All Users (*)</span>';
        } else {
          allowedHtml = tile.allowed_users.map(u => `<span class="user-pill-tag">${u}</span>`).join(" ");
        }

        const badgeHtml = tile.badge 
          ? `<span class="badge-preview badge-${tile.badge_color}">${tile.badge}</span>` 
          : '<span style="color: var(--text-muted);">&mdash;</span>';

        const statusHtml = tile.enabled 
          ? '<span style="color: var(--green); font-weight: 600;">Active</span>' 
          : '<span style="color: var(--text-muted);">Disabled</span>';

        tr.innerHTML = `
          <td><strong>#${tile.sort_order}</strong></td>
          <td>
            <div class="tile-title-cell">
              <span class="tile-icon">${tile.icon}</span>
              <div>
                <div>${tile.title}</div>
                <div class="tile-url">${tile.url}</div>
              </div>
            </div>
          </td>
          <td>${tile.category}</td>
          <td>${badgeHtml}</td>
          <td>${allowedHtml}</td>
          <td>${statusHtml}</td>
          <td>
            <div style="display: flex; gap: 0.4rem;">
              <button class="btn btn-secondary btn-sm" onclick="editTile('${tile.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteTile('${tile.id}', '${tile.title}')">Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openAddModal() {
      document.getElementById("modal-title").textContent = "Add New Tile";
      document.getElementById("tile-id").value = "";
      document.getElementById("tile-form").reset();
      document.getElementById("tile-sort").value = (currentTiles.length + 1);
      document.getElementById("tile-allowed").value = "*";
      document.getElementById("tile-enabled").checked = true;
      document.getElementById("tile-footer").value = "Open →";
      document.getElementById("modal-overlay").style.display = "flex";
    }

    function editTile(id) {
      const tile = currentTiles.find(t => t.id === id);
      if (!tile) return;

      document.getElementById("modal-title").textContent = "Edit Tile: " + tile.title;
      document.getElementById("tile-id").value = tile.id;
      document.getElementById("tile-title").value = tile.title;
      document.getElementById("tile-icon").value = tile.icon;
      document.getElementById("tile-url").value = tile.url;
      document.getElementById("tile-description").value = tile.description || "";
      document.getElementById("tile-category").value = tile.category || "Web Applications & Dashboards";
      document.getElementById("tile-sort").value = tile.sort_order;
      document.getElementById("tile-badge").value = tile.badge || "";
      document.getElementById("tile-badge-color").value = tile.badge_color || "purple";
      document.getElementById("tile-footer").value = tile.footer_text || "Open →";
      document.getElementById("tile-allowed").value = tile.allowed_users.join(", ");
      document.getElementById("tile-enabled").checked = tile.enabled;

      document.getElementById("modal-overlay").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal-overlay").style.display = "none";
    }

    async function saveTile(e) {
      e.preventDefault();
      const id = document.getElementById("tile-id").value;
      const allowedRaw = document.getElementById("tile-allowed").value;
      const allowed = allowedRaw.split(",").map(u => u.trim()).filter(Boolean);

      const payload = {
        title: document.getElementById("tile-title").value.trim(),
        icon: document.getElementById("tile-icon").value.trim(),
        url: document.getElementById("tile-url").value.trim(),
        description: document.getElementById("tile-description").value.trim(),
        category: document.getElementById("tile-category").value.trim() || "Web Applications & Dashboards",
        sort_order: parseInt(document.getElementById("tile-sort").value) || 0,
        badge: document.getElementById("tile-badge").value.trim() || null,
        badge_color: document.getElementById("tile-badge-color").value,
        footer_text: document.getElementById("tile-footer").value.trim() || "Open →",
        allowed_users: allowed.length ? allowed : ["*"],
        enabled: document.getElementById("tile-enabled").checked
      };

      try {
        let res;
        if (id) {
          res = await fetch(`/api/admin/tiles/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        } else {
          res = await fetch("/api/admin/tiles", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }

        if (!res.ok) {
          alert("Error saving tile: " + res.statusText);
          return;
        }

        closeModal();
        loadTiles();
      } catch (err) {
        alert("Failed to save tile: " + err.message);
      }
    }

    async function deleteTile(id, title) {
      if (!confirm(`Are you sure you want to delete tile "${title}"?`)) {
        return;
      }
      try {
        const res = await fetch(`/api/admin/tiles/${id}`, { method: "DELETE" });
        if (!res.ok) {
          alert("Error deleting tile");
          return;
        }
        loadTiles();
      } catch (err) {
        alert("Failed to delete tile: " + err.message);
      }
    }

    loadTiles();
  </script>
</body>
</html>
